name: Build CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  build:
    name: Build Linux (${{ matrix.cxx }})
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/future-re/memseek:20261012

    strategy:
      fail-fast: false
      matrix:
        include:
          - cxx: clang++-20
            cache_key: clang20
          - cxx: g++-13
            cache_key: gcc13

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /root/.ccache
          key: ${{ runner.os }}-${{ matrix.cache_key }}-ccache-${{ hashFiles('**/CMakeLists.txt', '**/*.cpp', '**/*.h', '**/*.hpp', '**/*.cppm') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.cache_key }}-ccache-

      - name: Show tool versions
        run: |
          uname -a || true
          cmake --version
          ${{ matrix.cxx }} --version

      - name: Configure project
        env:
          CCACHE_DIR: /root/.ccache
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build project
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --parallel

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Upload build artifact
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: build-output-linux-${{ matrix.cache_key }}
          path: build/
          retention-days: 7
